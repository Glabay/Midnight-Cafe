spring.application.name=Midnight-Cafe

# LOGGING
logging.file.name=./logs/midnight_logs.log
logging.level.root=INFO
logging.level.dev.midnightcoder=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR

# DATASOURCE
spring.datasource.url=jdbc:h2:file:./data/midnight_database
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:SECRET}
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.hibernate.ddl-auto=update
